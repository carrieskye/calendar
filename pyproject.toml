[tool.black]
line-length = 120
# py312 runtime; py311 here avoids Black’s “host Python older than target” warning when hooks run on 3.11.
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120
combine_as_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
